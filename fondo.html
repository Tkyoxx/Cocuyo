<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Fondo animado</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      video,
      img {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <video id="video" muted loop playsinline hidden></video>
    <img id="image" alt="" hidden />
    <script type="module" src="/src/fondo.ts"></script>
  </body>
</html>
