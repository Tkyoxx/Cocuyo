[package]
name = "cocuyo-overlay"
version = "0.1.0"
edition = "2021"
description = "Dibuja el aviso de voz de Cocuyo dentro de un juego a pantalla completa"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_SystemInformation",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Un proyecto aparte del de la app: no comparten carpeta de compilación.
[workspace]
