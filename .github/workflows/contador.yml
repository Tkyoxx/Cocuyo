name: Contador de instalaciones

# Cada Cocuyo nuevo baja una sola vez el archivito «instalacion» (1 byte) de la versión «contador».
# La insignia del README lee directo cuántas veces se bajó, así que no hace falta nada más.
# Este flujo solo crea esa versión si falta y quita lo del contador viejo («latido» y la rama «estadisticas»).
on:
  push:
    branches: [main]
    paths: [".github/workflows/contador.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - name: Que exista la versión «contador»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view contador --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf '1' > instalacion
            gh release create contador instalacion --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Contador de instalaciones (no es una versión)" \
              --notes "La primera vez que Cocuyo se abre en un PC baja este archivo de 1 byte, una sola vez. Así el README sabe en cuántos PC está instalado. No se manda nada más. Se apaga en Ajustes → Isla → «Contarme en las instalaciones»."
          fi

      - name: Quitar el contador viejo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latido --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/estadisticas" 2>/dev/null || true
