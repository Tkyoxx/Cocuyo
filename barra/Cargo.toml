[package]
name = "cocuyo-barra"
version = "0.1.0"
edition = "2021"
description = "Quita el fondo que Windows 11 le pinta a la barra de tareas, para que la transparencia se vea entera"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
windows-core = "0.62"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_Threading",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
